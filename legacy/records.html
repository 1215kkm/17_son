<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#F8FAFB">
  <title>방문 기록 - 내 치아 상태 정리하기</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .page-header {
      margin-bottom: var(--spacing-lg);
    }

    .page-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: var(--spacing-xs);
    }

    .page-desc {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    /* 다음 방문 카드 */
    .next-visit-card {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      border-radius: var(--border-radius);
      padding: var(--spacing-lg);
      margin-bottom: var(--spacing-lg);
      box-shadow: var(--shadow-md);
    }

    .next-visit-label {
      font-size: 0.85rem;
      opacity: 0.9;
      margin-bottom: var(--spacing-xs);
    }

    .next-visit-date {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: var(--spacing-xs);
    }

    .next-visit-reason {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    /* 추가 버튼 */
    .add-record-btn {
      position: fixed;
      bottom: calc(80px + env(safe-area-inset-bottom) + var(--spacing-md));
      right: var(--spacing-lg);
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      border: none;
      box-shadow: var(--shadow-lg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      z-index: 50;
      transition: var(--transition-normal);
    }

    .add-record-btn:active {
      transform: scale(0.95);
    }

    /* 기록 리스트 */
    .records-list {
      margin-top: var(--spacing-md);
    }

    .record-card {
      background: var(--bg-card);
      border-radius: var(--border-radius);
      padding: var(--spacing-lg);
      margin-bottom: var(--spacing-md);
      box-shadow: var(--shadow-sm);
      position: relative;
    }

    .record-date {
      font-size: 0.85rem;
      color: var(--primary);
      font-weight: 600;
      margin-bottom: var(--spacing-xs);
    }

    .record-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: var(--spacing-sm);
    }

    .record-details {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .record-tags {
      display: flex;
      flex-wrap: wrap;
      gap: var(--spacing-xs);
      margin-top: var(--spacing-sm);
    }

    .record-delete {
      position: absolute;
      top: var(--spacing-md);
      right: var(--spacing-md);
      background: none;
      border: none;
      color: var(--text-light);
      cursor: pointer;
      padding: 4px;
    }

    /* 빈 상태 */
    .empty-state {
      text-align: center;
      padding: var(--spacing-xxl);
    }

    .empty-icon {
      font-size: 4rem;
      margin-bottom: var(--spacing-md);
    }

    .empty-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: var(--spacing-xs);
    }

    .empty-desc {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    /* 모달 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition-normal);
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background: var(--bg-card);
      border-radius: var(--border-radius-lg) var(--border-radius-lg) 0 0;
      width: 100%;
      max-width: 430px;
      max-height: 85vh;
      overflow-y: auto;
      padding: var(--spacing-lg);
      padding-bottom: calc(var(--spacing-xl) + env(safe-area-inset-bottom));
      transform: translateY(100%);
      transition: transform var(--transition-normal);
    }

    .modal-overlay.active .modal-content {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--spacing-lg);
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--text-light);
      cursor: pointer;
      padding: var(--spacing-xs);
    }

    .form-group {
      margin-bottom: var(--spacing-lg);
    }

    .form-label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: var(--spacing-sm);
      color: var(--text-primary);
    }

    .form-input {
      width: 100%;
      padding: var(--spacing-md);
      border: 2px solid var(--border-light);
      border-radius: var(--border-radius-sm);
      font-size: 1rem;
      transition: var(--transition-fast);
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .form-textarea {
      min-height: 100px;
      resize: vertical;
    }

    /* 치료 종류 선택 */
    .treatment-options {
      display: flex;
      flex-wrap: wrap;
      gap: var(--spacing-xs);
    }

    .treatment-option {
      padding: 8px 14px;
      background: var(--bg-section);
      border: 2px solid transparent;
      border-radius: 20px;
      font-size: 0.9rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition-fast);
    }

    .treatment-option.selected {
      border-color: var(--primary);
      background: rgba(74, 144, 164, 0.1);
      color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 헤더 -->
    <header class="header">
      <button class="header-back" onclick="history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <span class="header-title">방문 기록</span>
      <div class="header-spacer"></div>
    </header>

    <!-- 메인 콘텐츠 -->
    <main class="main-content">
      <!-- 페이지 헤더 -->
      <section class="page-header fade-in">
        <h1 class="page-title">내 치과 기록</h1>
        <p class="page-desc">치과 방문 기록을 관리하고 다음 일정을 확인하세요</p>
      </section>

      <!-- 다음 방문 추천 -->
      <section class="next-visit-card fade-in delay-1" id="nextVisitCard" style="display: none;">
        <div class="next-visit-label">📅 다음 방문 추천</div>
        <div class="next-visit-date" id="nextVisitDate">-</div>
        <div class="next-visit-reason" id="nextVisitReason">-</div>
      </section>

      <!-- 기록 리스트 -->
      <section class="records-list fade-in delay-2" id="recordsList">
        <!-- 동적 생성 -->
      </section>
    </main>

    <!-- 추가 버튼 -->
    <button class="add-record-btn" onclick="openModal()">
      +
    </button>

    <!-- 하단 네비게이션 -->
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>홈</span>
      </a>
      <a href="diagnosis.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 11l3 3L22 4"></path>
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
        </svg>
        <span>증상체크</span>
      </a>
      <a href="tooth-map.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 8v8M8 12h8"></path>
        </svg>
        <span>치아맵</span>
      </a>
      <a href="records.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
        <span>기록</span>
      </a>
    </nav>

    <!-- 기록 추가 모달 -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
      <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h2 class="modal-title">방문 기록 추가</h2>
          <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>

        <form id="recordForm" onsubmit="submitRecord(event)">
          <div class="form-group">
            <label class="form-label">방문 날짜</label>
            <input type="date" class="form-input" id="visitDate" required>
          </div>

          <div class="form-group">
            <label class="form-label">치료 종류</label>
            <div class="treatment-options" id="treatmentOptions">
              <button type="button" class="treatment-option" data-treatment="scaling">스케일링</button>
              <button type="button" class="treatment-option" data-treatment="checkup">정기검진</button>
              <button type="button" class="treatment-option" data-treatment="filling">충치치료</button>
              <button type="button" class="treatment-option" data-treatment="rootcanal">신경치료</button>
              <button type="button" class="treatment-option" data-treatment="extraction">발치</button>
              <button type="button" class="treatment-option" data-treatment="implant">임플란트</button>
              <button type="button" class="treatment-option" data-treatment="crown">크라운</button>
              <button type="button" class="treatment-option" data-treatment="other">기타</button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">치료 부위 (선택)</label>
            <input type="text" class="form-input" id="toothArea" placeholder="예: 왼쪽 아래 어금니">
          </div>

          <div class="form-group">
            <label class="form-label">메모</label>
            <textarea class="form-input form-textarea" id="memo" placeholder="치료 내용이나 주의사항을 적어주세요"></textarea>
          </div>

          <button type="submit" class="btn btn-primary">저장하기</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // 치료 종류 라벨
    const treatmentLabels = {
      scaling: '스케일링',
      checkup: '정기검진',
      filling: '충치치료',
      rootcanal: '신경치료',
      extraction: '발치',
      implant: '임플란트',
      crown: '크라운',
      other: '기타'
    };

    let selectedTreatments = [];

    // 초기화
    document.addEventListener('DOMContentLoaded', () => {
      // 오늘 날짜 기본값
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('visitDate').value = today;

      // 치료 종류 선택 이벤트
      document.querySelectorAll('.treatment-option').forEach(btn => {
        btn.addEventListener('click', () => toggleTreatment(btn));
      });

      // 기록 렌더링
      renderRecords();
    });

    // 치료 종류 토글
    function toggleTreatment(btn) {
      const treatment = btn.dataset.treatment;
      const index = selectedTreatments.indexOf(treatment);

      if (index > -1) {
        selectedTreatments.splice(index, 1);
        btn.classList.remove('selected');
      } else {
        selectedTreatments.push(treatment);
        btn.classList.add('selected');
      }
    }

    // 모달 열기
    function openModal() {
      document.getElementById('modalOverlay').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    // 모달 닫기
    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
      document.body.style.overflow = '';

      // 폼 초기화
      document.getElementById('recordForm').reset();
      selectedTreatments = [];
      document.querySelectorAll('.treatment-option').forEach(btn => btn.classList.remove('selected'));

      // 오늘 날짜 다시 설정
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('visitDate').value = today;
    }

    // 모달 외부 클릭 시 닫기
    function closeModalOutside(event) {
      if (event.target.id === 'modalOverlay') {
        closeModal();
      }
    }

    // 기록 제출
    function submitRecord(event) {
      event.preventDefault();

      if (selectedTreatments.length === 0) {
        alert('치료 종류를 선택해주세요');
        return;
      }

      const record = {
        date: document.getElementById('visitDate').value,
        treatments: selectedTreatments,
        area: document.getElementById('toothArea').value,
        memo: document.getElementById('memo').value
      };

      recordManager.addRecord(record);
      closeModal();
      renderRecords();
    }

    // 기록 삭제
    function deleteRecord(id) {
      if (confirm('이 기록을 삭제할까요?')) {
        recordManager.deleteRecord(id);
        renderRecords();
      }
    }

    // 기록 렌더링
    function renderRecords() {
      const records = recordManager.getRecords();
      const container = document.getElementById('recordsList');
      const nextVisitCard = document.getElementById('nextVisitCard');

      if (records.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📋</div>
            <h3 class="empty-title">아직 기록이 없어요</h3>
            <p class="empty-desc">
              치과 방문 후 기록을 남겨두면<br>
              다음 방문 시기를 알려드려요
            </p>
          </div>
        `;
        nextVisitCard.style.display = 'none';
        return;
      }

      // 다음 방문 추천 계산
      const nextVisit = recordManager.getNextVisitRecommendation(records[0]);
      if (nextVisit) {
        nextVisitCard.style.display = 'block';
        document.getElementById('nextVisitDate').textContent = utils.formatDate(nextVisit.date);
        document.getElementById('nextVisitReason').textContent = nextVisit.reason;
      }

      // 기록 카드 렌더링
      container.innerHTML = records.map(record => `
        <div class="record-card">
          <button class="record-delete" onclick="deleteRecord(${record.id})">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
          <div class="record-date">${utils.formatDate(record.date)}</div>
          <div class="record-title">
            ${record.treatments.map(t => treatmentLabels[t]).join(', ')}
          </div>
          ${record.area ? `<div class="record-details">📍 ${record.area}</div>` : ''}
          ${record.memo ? `<div class="record-details">💬 ${record.memo}</div>` : ''}
          <div class="record-tags">
            ${record.treatments.map(t => `<span class="tag tag-primary">${treatmentLabels[t]}</span>`).join('')}
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
